name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 外部ライブラリは使用しない（Node.js 標準機能のみ）。
      - name: Validate game data
        run: node tests/validate-data.mjs

      # 空間グリッドの決定論的な非回帰テスト（M5-A・Node.js 標準機能のみ）。
      - name: Spatial grid non-regression
        run: node tests/spatial-nonregression.mjs

      # 保存システムのテスト（M5-B・Node.js 標準機能のみ・MemoryStorageAdapter 使用）。
      - name: Save system tests
        run: node tests/save-system.mjs

      # スキル抽選基盤のテスト（M6-A・Node.js 標準機能のみ）。
      - name: Skill draft tests
        run: node tests/skill-draft.mjs

      # 新スキル/新進化のテスト（M6-B・Node.js 標準機能のみ）。
      - name: New fire skills tests
        run: node tests/new-fire-skills.mjs
      - name: New evolutions tests
        run: node tests/new-evolutions.mjs

      # ジョブ育成（ジョブレベル・経験値・到達報酬・残響詠唱）のテスト（M6-C・Node.js 標準機能のみ）。
      - name: Job progression tests
        run: node tests/job-progression.mjs
      - name: Job modifiers tests
        run: node tests/job-modifiers.mjs

      # 新スキル/新進化 第2波・複製安全（M6-D・Node.js 標準機能のみ）。
      - name: Fire skills wave2 tests
        run: node tests/fire-skills-wave2.mjs
      - name: Fire evolutions wave2 tests
        run: node tests/fire-evolutions-wave2.mjs
      - name: Cast copy safety tests
        run: node tests/cast-copy-safety.mjs

      # 新スキル/新進化 第3波・残響/分身/タグ/主発動監査（M6-E・Node.js 標準機能のみ）。
      - name: Fire skills wave3 tests
        run: node tests/fire-skills-wave3.mjs
      - name: Fire evolutions wave3 tests
        run: node tests/fire-evolutions-wave3.mjs
      - name: Skill tag audit tests
        run: node tests/skill-tag-audit.mjs
      - name: Cast event audit tests
        run: node tests/cast-event-audit.mjs

      # 通常プレイ整備（M6-F・カタログ/抽選シミュ/進化成立性/テレメトリ/検証モード・Node.js 標準機能のみ・軽量）。
      - name: Skill catalog tests
        run: node tests/skill-catalog.mjs
      - name: Draft balance simulation (light)
        run: node tests/draft-balance-simulation.mjs
      - name: Evolution feasibility tests
        run: node tests/evolution-feasibility.mjs
      - name: Combat telemetry tests
        run: node tests/combat-telemetry.mjs
      - name: Balance playtest tests
        run: node tests/balance-playtest.mjs

      # 状態異常基盤・氷術師（M7-A・Node.js 標準機能のみ）。
      - name: Status effects tests
        run: node tests/status-effects.mjs
      - name: Freeze system tests
        run: node tests/freeze-system.mjs
      - name: Multi-job selection tests
        run: node tests/multi-job-selection.mjs
      - name: Frost job progression tests
        run: node tests/frost-job-progression.mjs
      - name: Frost skills tests
        run: node tests/frost-skills.mjs
      - name: Frost evolutions tests
        run: node tests/frost-evolutions.mjs
      - name: Multi-job draft tests
        run: node tests/multi-job-draft.mjs
      - name: Status save non-regression tests
        run: node tests/status-save-nonregression.mjs
      - name: Frost cooldown persistence tests
        run: node tests/frost-cooldown-save.mjs

      # 氷術師 第2波（M7-B・active10種・進化5種・ポリシー監査・runtime保存・決定論・Node.js 標準機能のみ）。
      - name: Frost skills wave2 tests
        run: node tests/frost-skills-wave2.mjs
      - name: Frost evolutions wave2 tests
        run: node tests/frost-evolutions-wave2.mjs
      - name: Frost policy audit tests
        run: node tests/frost-policy-audit.mjs
      - name: Frost runtime save wave2 tests
        run: node tests/frost-runtime-save-wave2.mjs
      - name: Frost determinism wave2 tests
        run: node tests/frost-determinism-wave2.mjs
      - name: Passive pool separation audit
        run: node tests/passive-pool-audit.mjs

      # 氷術師 第3波（M7-C・active10種・進化5種・ポリシー監査・runtime保存・決定論・Node.js 標準機能のみ）。
      - name: Frost skills wave3 tests
        run: node tests/frost-skills-wave3.mjs
      - name: Frost evolutions wave3 tests
        run: node tests/frost-evolutions-wave3.mjs
      - name: Frost policy audit wave3 tests
        run: node tests/frost-policy-audit-wave3.mjs
      - name: Frost runtime save wave3 tests
        run: node tests/frost-runtime-save-wave3.mjs
      - name: Frost determinism wave3 tests
        run: node tests/frost-determinism-wave3.mjs
      - name: Frost boss gauge (bossGaugeMult) tests
        run: node tests/frost-boss-gauge-wave3.mjs

      # 氷術師 最終波（M7-D・active5種・進化5種・カタログ完成30/18・marker・Node.js 標準機能のみ）。
      - name: Frost skills wave4 tests
        run: node tests/frost-skills-wave4.mjs
      - name: Frost evolutions wave4 tests
        run: node tests/frost-evolutions-wave4.mjs
      - name: Frost policy audit wave4 tests
        run: node tests/frost-policy-audit-wave4.mjs
      - name: Frost runtime save wave4 tests
        run: node tests/frost-runtime-save-wave4.mjs
      - name: Frost determinism wave4 tests
        run: node tests/frost-determinism-wave4.mjs
      - name: Frost boss gauge wave4 tests
        run: node tests/frost-boss-gauge-wave4.mjs

      # 氷術師 完成監査（M7-E・カタログ/到達性/抽選シミュ/死にコンテンツ/監査/保存/決定論/状態/上限/後始末/テレメトリ）。
      # 新スキルは追加せず、production の SkillDraftManager + SeededRandom で 200 seed を回す（HEAVY=1 で 500 seed）。
      - name: Frost completion catalog audit
        run: node tests/frost-completion-catalog.mjs
      - name: Frost evolution reachability audit
        run: node tests/frost-evolution-reachability.mjs
      - name: Frost draft balance simulation
        run: node tests/frost-draft-balance.mjs
      - name: Frost evolution distribution
        run: node tests/frost-evolution-distribution.mjs
      - name: Frost dead content audit
        run: node tests/frost-dead-content-audit.mjs
      - name: Frost complete skill audit
        run: node tests/frost-complete-skill-audit.mjs
      - name: Frost complete runtime save audit
        run: node tests/frost-complete-runtime-save.mjs
      - name: Frost complete determinism audit
        run: node tests/frost-complete-determinism.mjs
      - name: Frost status balance analysis
        run: node tests/frost-status-balance.mjs
      - name: Frost quality cap audit
        run: node tests/frost-quality-cap-audit.mjs
      - name: Frost cleanup audit
        run: node tests/frost-cleanup-audit.mjs
      - name: Frost telemetry audit
        run: node tests/frost-telemetry-audit.mjs

      # 火の魔女 完成監査（M8-A・カタログ/到達性/抽選シミュ/死にコンテンツ/監査/保存/決定論/炎上/上限/後始末/テレメトリ）。
      # 新スキルは追加せず、production の SkillDraftManager + SeededRandom で 200 seed を回す（HEAVY=1 で 500 seed）。
      - name: Flame completion catalog audit
        run: node tests/flame-completion-catalog.mjs
      - name: Flame evolution reachability audit
        run: node tests/flame-evolution-reachability.mjs
      - name: Flame draft balance simulation
        run: node tests/flame-draft-balance.mjs
      - name: Flame evolution distribution
        run: node tests/flame-evolution-distribution.mjs
      - name: Flame dead content audit
        run: node tests/flame-dead-content-audit.mjs
      - name: Flame complete skill audit
        run: node tests/flame-complete-skill-audit.mjs
      - name: Flame complete runtime save audit
        run: node tests/flame-complete-runtime-save.mjs
      - name: Flame complete determinism audit
        run: node tests/flame-complete-determinism.mjs
      - name: Flame status (burning/DoT/explosion/resonance) balance analysis
        run: node tests/flame-status-balance.mjs
      - name: Flame quality cap audit
        run: node tests/flame-quality-cap-audit.mjs
      - name: Flame cleanup audit
        run: node tests/flame-cleanup-audit.mjs
      - name: Flame telemetry audit
        run: node tests/flame-telemetry-audit.mjs

      # 戦士 基盤（M8-B・カタログ/プール分離/闘気/コンボ/回復/不屈/体勢/スキル/進化/JobLv/保存/決定論/上限/後始末/テレメトリ/3ジョブ非回帰）。
      # 新しい npm 依存は追加しない（Node.js 標準機能のみ）。
      - name: Warrior catalog audit
        run: node tests/warrior-catalog.mjs
      - name: Warrior pool eligibility audit
        run: node tests/warrior-pool-eligibility.mjs
      - name: Warrior draft determinism
        run: node tests/warrior-draft-determinism.mjs
      - name: Warrior fury tests
        run: node tests/warrior-fury.mjs
      - name: Warrior combo tests
        run: node tests/warrior-combo.mjs
      - name: Warrior recovery / mitigation tests
        run: node tests/warrior-recovery.mjs
      - name: Warrior unyielding tests
        run: node tests/warrior-unyielding.mjs
      - name: Warrior knockback / poise tests
        run: node tests/warrior-poise.mjs
      - name: Warrior active skills tests
        run: node tests/warrior-active-skills.mjs
      - name: Warrior evolutions tests
        run: node tests/warrior-evolutions.mjs
      - name: Warrior job level tests
        run: node tests/warrior-job-level.mjs
      - name: Warrior runtime save tests
        run: node tests/warrior-runtime-save.mjs
      - name: Warrior save determinism tests
        run: node tests/warrior-save-determinism.mjs
      - name: Warrior quality cap audit
        run: node tests/warrior-quality-cap.mjs
      - name: Warrior cleanup audit
        run: node tests/warrior-cleanup.mjs
      - name: Warrior telemetry / HUD tests
        run: node tests/warrior-telemetry.mjs
      - name: Three job non-regression tests
        run: node tests/three-job-nonregression.mjs

      # status passive 再計算バグ修正（M8-B.1・即時反映/レベルアップ/保存復元/ジョブ分離/version gating/非回帰）。
      # 新しい npm 依存は追加しない（Node.js 標準機能のみ）。
      - name: Status passive refresh tests
        run: node tests/status-passive-refresh.mjs
      - name: Status passive level-up refresh tests
        run: node tests/status-passive-levelup-refresh.mjs
      - name: Status passive version gating tests
        run: node tests/status-passive-version-gating.mjs
      - name: Status passive save / reload tests
        run: node tests/status-passive-save-reload.mjs
      - name: Status passive job isolation tests
        run: node tests/status-passive-job-isolation.mjs
      - name: Status passive non-regression tests
        run: node tests/status-passive-nonregression.mjs

      # 戦士スキル拡張 Wave1（M8-C・active15/passive4/進化8）。
      # カタログ/プール/抽選/進化/各スキル固有仕様/Lv80/保存/決定論/上限/後始末/テレメトリ/3ジョブ非回帰。
      # 新しい npm 依存は追加しない（Node.js 標準機能のみ）。HEAVY=1 で seed 数を増やせる。
      - name: Warrior Wave1 catalog audit
        run: node tests/warrior-wave1-catalog.mjs
      - name: Warrior Wave1 pool audit
        run: node tests/warrior-wave1-pool.mjs
      - name: Warrior Wave1 draft tests
        run: node tests/warrior-wave1-draft.mjs
      - name: Warrior Wave1 evolutions tests
        run: node tests/warrior-wave1-evolutions.mjs
      - name: Warrior armor breaker / twin fang tests
        run: node tests/warrior-armor-breaker.mjs
      - name: Warrior execution tests
        run: node tests/warrior-execution.mjs
      - name: Warrior leap tests
        run: node tests/warrior-leap.mjs
      - name: Warrior sweeping advance / stomp tests
        run: node tests/warrior-sweeping.mjs
      - name: Warrior counter arbitration tests
        run: node tests/warrior-counter-arbitration.mjs
      - name: Warrior war cry tests
        run: node tests/warrior-war-cry.mjs
      - name: Warrior chain hook tests
        run: node tests/warrior-chain-hook.mjs
      - name: Warrior relentless combo tests
        run: node tests/warrior-relentless-combo.mjs
      - name: Warrior Wave1 job level 80 tests
        run: node tests/warrior-wave1-job80.mjs
      - name: Warrior Wave1 runtime save tests
        run: node tests/warrior-wave1-runtime-save.mjs
      - name: Warrior Wave1 determinism tests
        run: node tests/warrior-wave1-determinism.mjs
      - name: Warrior Wave1 quality cap audit
        run: node tests/warrior-wave1-quality-cap.mjs
      - name: Warrior Wave1 cleanup audit
        run: node tests/warrior-wave1-cleanup.mjs
      - name: Warrior Wave1 telemetry / F8 / F9 tests
        run: node tests/warrior-wave1-telemetry.mjs
      - name: Three job Wave1 non-regression tests
        run: node tests/three-job-wave1-nonregression.mjs

      # 戦士4枠時の進化導線修正（M8-C.1・production SkillDraftManager 上の warrior 限定 guidance）。
      # 導線接続 / slot 別到達率 / pity / synergy / active 補助進化 / build 多様性 / 保存 / 決定論 / 非回帰。
      # 新しい npm 依存は追加しない（Node.js 標準機能のみ）。HEAVY=1 で seed 数を増やせる。
      - name: Warrior evolution guidance tests
        run: node tests/warrior-evolution-guidance.mjs
      - name: Warrior slot4 evolution rate tests
        run: node tests/warrior-slot4-evolution-rate.mjs
      - name: Warrior evolution pity tests
        run: node tests/warrior-evolution-pity.mjs
      - name: Warrior evolution synergy tests
        run: node tests/warrior-evolution-synergy.mjs
      - name: Warrior active support evolution tests
        run: node tests/warrior-active-support-evolution.mjs
      - name: Warrior build diversity tests
        run: node tests/warrior-build-diversity.mjs
      - name: Warrior draft save / reload tests
        run: node tests/warrior-draft-save-reload.mjs
      - name: Warrior draft guidance determinism tests
        run: node tests/warrior-draft-guidance-determinism.mjs
      - name: Warrior draft guidance non-regression tests
        run: node tests/warrior-draft-guidance-nonregression.mjs

      # 戦士スキル拡張 Wave2（M8-D・active25 / passive4 / evolution13・Node.js 標準機能のみ）。
      - name: Warrior wave2 catalog tests
        run: node tests/warrior-wave2-catalog.mjs
      - name: Warrior wave2 pool tests
        run: node tests/warrior-wave2-pool.mjs
      - name: Warrior wave2 draft tests
        run: node tests/warrior-wave2-draft.mjs
      - name: Warrior wave2 guidance tests
        run: node tests/warrior-wave2-guidance.mjs
      - name: Warrior wave2 evolution tests
        run: node tests/warrior-wave2-evolutions.mjs
      - name: Warrior rising slash tests
        run: node tests/warrior-rising-slash.mjs
      - name: Warrior shield charge tests
        run: node tests/warrior-shield-charge.mjs
      - name: Warrior backstep riposte tests
        run: node tests/warrior-backstep-riposte.mjs
      - name: Warrior battlefield throw tests
        run: node tests/warrior-battlefield-throw.mjs
      - name: Warrior triple crush tests
        run: node tests/warrior-triple-crush.mjs
      - name: Warrior blade guard tests
        run: node tests/warrior-blade-guard.mjs
      - name: Warrior berserker rush tests
        run: node tests/warrior-berserker-rush.mjs
      - name: Warrior war axe throw tests
        run: node tests/warrior-war-axe-throw.mjs
      - name: Warrior breaker knee tests
        run: node tests/warrior-breaker-knee.mjs
      - name: Warrior rallying banner tests
        run: node tests/warrior-rallying-banner.mjs
      - name: Warrior wave2 runtime save tests
        run: node tests/warrior-wave2-runtime-save.mjs
      - name: Warrior wave2 determinism tests
        run: node tests/warrior-wave2-determinism.mjs
      - name: Warrior wave2 quality cap tests
        run: node tests/warrior-wave2-quality-cap.mjs
      - name: Warrior wave2 cleanup tests
        run: node tests/warrior-wave2-cleanup.mjs
      - name: Warrior wave2 telemetry tests
        run: node tests/warrior-wave2-telemetry.mjs
      - name: Three job wave2 non-regression tests
        run: node tests/three-job-wave2-nonregression.mjs

      # 状態異常の視認性・実動作検証（M7-B.1・表示状態/デバッグ/ボス氷砕UI/非回帰・Node.js 標準機能のみ）。
      - name: Status visual state tests
        run: node tests/status-visual-state.mjs
      - name: Status debug panel tests
        run: node tests/status-debug-panel.mjs
      - name: Frostbreak UI state tests
        run: node tests/frostbreak-ui-state.mjs
      - name: Status visibility non-regression tests
        run: node tests/status-visibility-nonregression.mjs

name: Validate data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 外部ライブラリは使用しない（Node.js 標準機能のみ）。
      - name: Validate game data
        run: node tests/validate-data.mjs

      # 空間グリッドの決定論的な非回帰テスト（M5-A・Node.js 標準機能のみ）。
      - name: Spatial grid non-regression
        run: node tests/spatial-nonregression.mjs

      # 保存システムのテスト（M5-B・Node.js 標準機能のみ・MemoryStorageAdapter 使用）。
      - name: Save system tests
        run: node tests/save-system.mjs
